# Render.com blueprint — free web service + persistent disk for the SQLite database.
# Deploy: New → Blueprint → point at this repo. Set JWT_SECRET when prompted (or let Render generate it).
services:
  - type: web
    name: aieses
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.13.0
      - key: DEMO_MODE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/aieses.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: demo
      - key: DIKSHA_MODE
        value: mock
      - key: EXEC_PROVIDER
        value: simulated
    disk:
      name: aieses-data
      mountPath: /var/data
      sizeGB: 1
